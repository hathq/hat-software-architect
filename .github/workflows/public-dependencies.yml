# Added to verify independently resolved public worker dependencies.
name: Locked public worker dependencies
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Test the locked official dependency graph
        run: cargo +1.97.1 test --locked --all-targets
      - name: Check review and worker lints
        run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - name: Read pinned shared lifecycle verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: coela-oss/engineering
          ref: 7569fa23b3a1236f76fdd885e2fc1e300063a296
          path: .engineering-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.3
      - name: Compare actual review output, closed schemas and lifecycle coverage
        env:
          ENGINEERING_SOURCE: ${{ github.workspace }}/.engineering-source
          ARCHITECT_BINARY: ${{ github.workspace }}/target/debug/hat-software-architect-worker
          REVIEW_REPORT: ${{ runner.temp }}/review-lifecycle.json
        run: |
          node --test tests/authoring-kit.test.mjs
          pnpm --dir .engineering-source install --frozen-lockfile --ignore-scripts
          node scripts/verify-review-lifecycle.mts
      - name: Retain review coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/review-lifecycle.json
          if-no-files-found: error
